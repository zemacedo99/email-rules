[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rwz-importer"
version = "1.0.0"
description = "Manage server-side inbox rules across providers (Outlook/Exchange, Gmail, IMAP/Sieve), and import Outlook Classic .rwz rule exports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rwz-importer contributors" }]
keywords = ["outlook", "gmail", "imap", "sieve", "rwz", "exchange", "owa", "rules", "migration"]
dependencies = [
    "httpx>=0.24",
    "click>=8.1",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2,<2",
]
web = [
    "starlette>=0.37",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
imap = [
    "sievelib>=1.4",
]
dev = [
    "pytest>=7.0",
    "mcp>=1.2,<2",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "sievelib>=1.4",
]

[project.scripts]
rwz-importer = "rwz_importer.cli:cli"
rwz-importer-mcp = "rwz_importer.mcp_server:main"
rwz-importer-web = "rwz_importer.web.app:main"

[tool.setuptools.packages.find]
include = ["rwz_importer*"]

[tool.setuptools.package-data]
"rwz_importer.web" = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
