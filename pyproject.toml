[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rwz-importer"
version = "1.0.0"
description = "Parse Outlook Classic .rwz rule exports and recreate them as server-side rules in New Outlook / Outlook Web via the OWA REST API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rwz-importer contributors" }]
keywords = ["outlook", "rwz", "exchange", "owa", "rules", "migration"]
dependencies = [
    "httpx>=0.24",
    "click>=8.1",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=7.0",
    "mcp>=1.2",
]

[project.scripts]
rwz-importer = "rwz_importer.cli:cli"
rwz-importer-mcp = "rwz_importer.mcp_server:main"

[tool.setuptools.packages.find]
include = ["rwz_importer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
